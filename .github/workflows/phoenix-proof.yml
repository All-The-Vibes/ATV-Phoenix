name: Phoenix proof

on:
  pull_request:
  workflow_dispatch:
    inputs:
      acceptance_command:
        description: Acceptance check command to prove red on base and green on head.
        required: false
        default: python -m pytest tests/test_phoenix_learn.py -q

permissions:
  contents: read

env:
  PHOENIX_ACCEPTANCE_COMMAND: ${{ inputs.acceptance_command || 'python -m pytest tests/test_phoenix_learn.py -q' }}

jobs:
  phoenix-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Detect acceptance contract
        id: acceptance_contract
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ -f .phoenix-ralph/done-check.json ]; then
              echo "declared=true" >> "$GITHUB_OUTPUT"
            else
              echo "declared=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "declared=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Require an acceptance contract
        if: ${{ github.event_name == 'pull_request' && steps.acceptance_contract.outputs.declared != 'true' }}
        run: |
          set -euo pipefail
          echo "This head has no .phoenix-ralph/done-check.json." >&2
          echo "Every proof step below is gated on that file, so this run would skip all of them" >&2
          echo "and still report SUCCESS. Failing instead, because a green that proved nothing is" >&2
          echo "worse than a red: any merge gate reading statusCheckRollup would count it as Tier 2." >&2
          exit 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
      - name: Require a fresh acceptance contract
        if: ${{ github.event_name == 'pull_request' && steps.acceptance_contract.outputs.declared == 'true' }}
        run: |
          set -euo pipefail
          mapfile -t acceptance_tests < <(
            python - .phoenix-ralph/done-check.json <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath

          with open(sys.argv[1], encoding="utf-8") as check_file:
              check = json.load(check_file)
          for argument in check.get("target", []):
              if not isinstance(argument, str):
                  continue
              candidate = argument.split("::", 1)[0]
              path = PurePosixPath(candidate)
              if (
                  path.parts
                  and path.parts[0] == "tests"
                  and path.suffix == ".py"
                  and ".." not in path.parts
              ):
                  print(candidate)
          PY
          )
          if [ "${#acceptance_tests[@]}" -eq 0 ]; then
            echo "The acceptance contract names no tests/*.py file, so freshness cannot be"
            echo "checked here; the base RED gate below still has to prove it is not vacuous."
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          base_sha="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          changed="$(git diff --name-only "$base_sha" HEAD -- "${acceptance_tests[@]}")"
          if [ -z "$changed" ]; then
            echo "Stale acceptance contract: .phoenix-ralph/done-check.json still points at" >&2
            printf '  %s\n' "${acceptance_tests[@]}" >&2
            echo "and this pull request changes none of them, so the contract was inherited from" >&2
            echo "an earlier PR that already turned it green on main. The base RED gate below" >&2
            echo "would fail as vacuous after paying for a Rust build; failing here instead." >&2
            echo "Point the contract at the check this pull request turns red -> green." >&2
            exit 1
          fi
          echo "Acceptance contract is fresh; this pull request changes:"
          echo "$changed"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Install Python dependencies
        run: >-
          python -m pip install --quiet --only-binary=:all:
          pytest==9.0.2 PyYAML==6.0.3 iniconfig==2.3.0
          packaging==24.2 pluggy==1.5.0 pygments==2.19.1
      - name: Prepare proof inputs
        if: ${{ steps.acceptance_contract.outputs.declared == 'true' }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            BASE_SHA="$(git merge-base "$HEAD_SHA" "origin/${{ github.base_ref }}")"
            cp .phoenix-ralph/done-check.json "$RUNNER_TEMP/phoenix-check.json"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          check = {
              "kind": "command_exit",
              "target": ["bash", "-lc", os.environ["PHOENIX_ACCEPTANCE_COMMAND"]],
              "expect": "0",
          }
          Path(os.environ["RUNNER_TEMP"], "phoenix-check.json").write_text(
              json.dumps(check, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          fi
          {
            echo "PHOENIX_BASE_SHA=$BASE_SHA"
            echo "PHOENIX_HEAD_SHA=$HEAD_SHA"
            echo "PHOENIX_CHECK_FILE=$RUNNER_TEMP/phoenix-check.json"
            echo "PHOENIX_PROOF_FILE=$RUNNER_TEMP/phoenix-acceptance-proof.json"
            echo "PHOENIX_MCP=$RUNNER_TEMP/phoenix-bin/phoenix-mcp"
          } >> "$GITHUB_ENV"
      - name: Build Phoenix MCP verifier
        if: ${{ steps.acceptance_contract.outputs.declared == 'true' }}
        run: |
          set -euo pipefail
          git checkout --force "$PHOENIX_BASE_SHA"
          cargo build --release --locked --bin phoenix-mcp
          mkdir -p "$RUNNER_TEMP/phoenix-bin"
          cp target/release/phoenix-mcp "$PHOENIX_MCP"
      - name: Require base acceptance RED
        if: ${{ steps.acceptance_contract.outputs.declared == 'true' }}
        run: |
          set -euo pipefail
          mapfile -t acceptance_tests < <(
            python - "$PHOENIX_CHECK_FILE" <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath

          # Every file the contract names has to be restored from head before sensing base.
          # #146 folds the sha256 of each existing target file into the check digest, so a file
          # the pull request ADDS is absent on base, digests differently there, and `accept`
          # then finds no RED for the head digest. Restoring only tests/*.py left that true for
          # gate scripts, Rust integration tests, and tests living outside tests/ (#173).
          #
          # Anything path-shaped is a candidate; `git checkout` below tolerates the ones that do
          # not exist at head, so over-selecting here is safe and under-selecting is not.
          with open(sys.argv[1], encoding="utf-8") as check_file:
              check = json.load(check_file)
          for argument in check.get("target", []):
              if not isinstance(argument, str):
                  continue
              candidate = argument.split("::", 1)[0]
              if not candidate or candidate.startswith("-"):
                  continue
              path = PurePosixPath(candidate)
              if not path.parts or ".." in path.parts or path.is_absolute():
                  continue
              # A bare binary name on PATH ("python", "cargo") is not a file we can restore.
              if len(path.parts) == 1 and not path.suffix:
                  continue
              print(candidate)
          PY
          )
          git checkout --force "$PHOENIX_BASE_SHA"
          for test_file in "${acceptance_tests[@]}"; do
            # Tolerated: a contract may name a path that does not exist at head (a flag that
            # looks path-shaped, a file the PR deletes). Restoring what does exist is the point.
            git checkout "$PHOENIX_HEAD_SHA" -- "$test_file" 2>/dev/null || true
          done
          if "$PHOENIX_MCP" sense "@$PHOENIX_CHECK_FILE"; then
            echo "Base acceptance check unexpectedly passed; proof is vacuous." >&2
            exit 1
          fi
          echo "Base acceptance check is RED as required."
      - name: Require head acceptance GREEN
        if: ${{ steps.acceptance_contract.outputs.declared == 'true' }}
        run: |
          set -euo pipefail
          git checkout --force "$PHOENIX_HEAD_SHA"
          "$PHOENIX_MCP" sense "@$PHOENIX_CHECK_FILE"
      - name: Prove Phoenix acceptance
        if: ${{ steps.acceptance_contract.outputs.declared == 'true' }}
        run: |
          set -euo pipefail
          "$PHOENIX_MCP" accept "@$PHOENIX_CHECK_FILE" > "$PHOENIX_PROOF_FILE"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path(os.environ["PHOENIX_PROOF_FILE"]).read_text(encoding="utf-8"))
          for key in ("saw_red", "green_after_red", "currently_green", "trace_intact"):
              if data.get(key) is not True:
                  raise SystemExit(f"phoenix-mcp accept did not prove {key}=true")
          PY
      - name: Verify Phoenix trace
        if: ${{ steps.acceptance_contract.outputs.declared == 'true' }}
        run: |
          set -euo pipefail
          "$PHOENIX_MCP" verify-trace
      - name: Upload Phoenix proof artifacts
        if: ${{ always() && steps.acceptance_contract.outputs.declared == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-proof
          path: |
            .phoenix/trace.jsonl
            ${{ env.PHOENIX_PROOF_FILE }}
